    @keyframes btnPulse {

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;

    .typing-dot:nth-child(3) {

    @keyframes typingPulse {

    .btn-option {

    let hasTriggeredExitPopup = false;
    let lastScrollY = 0;
    let lastScrollTimestamp = Date.now();

    function onScrollFastUp() {
      const currentScrollTop = feed ? feed.scrollTop : window.scrollY;
      const now = Date.now();
      const timeDelta = now - lastScrollTimestamp;
      const scrollDelta = lastScrollY - currentScrollTop;

      if (!hasTriggeredExitPopup && timeDelta > 0 && scrollDelta > 160 && timeDelta < 220) {
        hasTriggeredExitPopup = true;
        openExitPopup();
      }

      lastScrollY = currentScrollTop;
      lastScrollTimestamp = now;
    }

    if (feed) feed.addEventListener('scroll', onScrollFastUp, { passive: true });

    document.addEventListener('mouseleave', (e) => {
      if (!hasTriggeredExitPopup && e.clientY <= 0) {
        hasTriggeredExitPopup = true;
        openExitPopup();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && !hasTriggeredExitPopup) {
        hasTriggeredExitPopup = true;
      }
    });
